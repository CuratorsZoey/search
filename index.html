<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search · Curators of Travel Admin</title>
    <link rel="stylesheet" href="https://unpkg.com/antd@5/dist/reset.css" />
    <style>
      :root { --navy:#031b2d; --blue:#1890ff; --ink:#0d2138; }
      * { box-sizing: border-box; }
      body { margin: 0; background:#f5f7fa; font-family: Arial, Helvetica, sans-serif; color: var(--ink); }
      .brand { height:54px; background:var(--navy); color:#fff; display:flex; align-items:center; gap:10px; padding:0 19px; letter-spacing:3px; font-size:13px; font-weight:600; }
      .brand-mark { border:1.5px solid #fff; height:29px; width:29px; border-radius:50%; display:grid; place-items:center; font-size:15px; letter-spacing:0; }
      .shell { min-height: calc(100vh - 54px); display:flex; }
      .sidebar { width:235px; background:#fff; border-right:1px solid #edf0f2; padding-top:4px; }
      .side-link { height:47px; display:flex; align-items:center; padding:0 25px; color:#11243a; font-size:16px; }
      .side-link.section { color:#1684f5; background:#fafafa; }
      .side-link.indent { padding-left:50px; font-size:15px; }
      .side-link.selected { background:#e6f7ff; color:#1684f5; border-right:2px solid #1684f5; }
      .main { flex:1; min-width:0; padding:31px 44px 48px; }
      .page-heading { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
      .page-heading h1 { margin:0; font-size:28px; font-weight:600; letter-spacing:-.2px; }
      .subcopy { color:#66788a; margin:6px 0 0; }
      .context-card { border-radius:2px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:20px; }
      .table-card { background:#fff; border-radius:2px; box-shadow:0 1px 4px rgba(0,0,0,.06); overflow:hidden; }
      .hotel-option { display:flex; flex-direction:column; line-height:1.32; }
      .hotel-option small { color:#8492a6; }
      .muted { color:#8a97a7; }
      .hint { margin-top:8px; color:#8492a6; font-size:12px; }
      .footer-note { color:#7e8a9a; font-size:12px; margin-top:16px; }
      @media (max-width: 850px) { .sidebar { width:190px; } .main { padding:24px 18px; } .side-link { padding-left:18px; } .side-link.indent { padding-left:35px; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/dayjs@1/dayjs.min.js"></script>
    <script src="https://unpkg.com/antd@5/dist/antd.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      const { Button, Card, Col, ConfigProvider, DatePicker, Form, Modal, Popconfirm, Row, Select, Space, Table, Tag, Tooltip, message } = antd;
      const { RangePicker } = DatePicker;

      const destinations = [
        { value: 'tokyo', label: 'Tokyo, Japan' }, { value: 'new-york', label: 'New York, USA' },
        { value: 'copenhagen', label: 'Copenhagen, Denmark' }, { value: 'miami', label: 'Miami, USA' },
        { value: 'shanghai', label: 'Shanghai, China' }, { value: 'kyoto', label: 'Kyoto, Japan' }
      ];
      const hotels = [
        { id:'tok-001', name:'Aman Tokyo', code:'TYOAMN01', destination:'tokyo', destinationLabel:'Tokyo', published:true },
        { id:'tok-002', name:'The Peninsula Tokyo', code:'TYOPNH02', destination:'tokyo', destinationLabel:'Tokyo', published:true },
        { id:'tok-003', name:'HOSHINOYA Tokyo', code:'TYOHOS03', destination:'tokyo', destinationLabel:'Tokyo', published:true },
        { id:'tok-004', name:'Tokyo Hidden Hotel', code:'TYOHID99', destination:'tokyo', destinationLabel:'Tokyo', published:false },
        { id:'ny-001', name:'1 Hotel Brooklyn Bridge', code:'BINYCHBB', destination:'new-york', destinationLabel:'New York', published:true },
        { id:'ny-002', name:'The Whitby Hotel', code:'NYWHIT02', destination:'new-york', destinationLabel:'New York', published:true },
        { id:'ny-003', name:'The Beekman', code:'NYBEEK03', destination:'new-york', destinationLabel:'New York', published:true },
        { id:'cop-001', name:'Hotel d’Angleterre', code:'CPHPHS01', destination:'copenhagen', destinationLabel:'Copenhagen', published:true },
        { id:'cop-002', name:'Nimb Hotel', code:'CPHNIM02', destination:'copenhagen', destinationLabel:'Copenhagen', published:true },
        { id:'mia-001', name:'1 Hotel South Beach', code:'BIMIA805', destination:'miami', destinationLabel:'Miami', published:true }
      ];
      const initialSettings = [
        { id: 1, destination:'tokyo', hotelId:'tok-001', rank:1, start:'2026-11-01 00:00', end:'2026-12-15 23:59' },
        { id: 2, destination:'tokyo', hotelId:'tok-002', rank:2, start:'2026-12-01 00:00', end:'2026-12-31 23:59' },
        { id: 3, destination:'tokyo', hotelId:'tok-003', rank:3, start:'2026-09-01 00:00', end:'2026-10-01 23:59' },
        { id: 4, destination:'new-york', hotelId:'ny-001', rank:1, start:'2026-11-01 00:00', end:'2026-12-31 23:59' }
      ];
      const format = 'YYYY-MM-DD HH:mm';
      const dateStatus = row => {
        const now = dayjs();
        if (now.isBefore(dayjs(row.start, format))) return 'Scheduled';
        if (now.isAfter(dayjs(row.end, format))) return 'Expired';
        return 'Active';
      };
      const statusTag = status => {
        const colors = { Active:'green', Scheduled:'blue', Expired:'default' };
        return <Tag color={colors[status]}>{status}</Tag>;
      };
      function HotelLabel({hotel}) { return <div className="hotel-option"><span>{hotel.name}</span><small>{hotel.destinationLabel} · {hotel.code}</small></div>; }

      function App() {
        const [selectedCity, setSelectedCity] = React.useState('tokyo');
        const [settings, setSettings] = React.useState(initialSettings);
        const [isModalOpen, setModalOpen] = React.useState(false);
        const [editing, setEditing] = React.useState(null);
        const [form] = Form.useForm();
        const [nowTick, setNowTick] = React.useState(0);
        React.useEffect(() => { const timer = setInterval(() => setNowTick(n => n + 1), 30000); return () => clearInterval(timer); }, []);
        const citySettings = settings.filter(item => item.destination === selectedCity).sort((a,b) => a.rank - b.rank);
        const cityName = destinations.find(d => d.value === selectedCity)?.label;
        const availableHotels = hotels.filter(h => h.published && h.destination === selectedCity);
        const openAdd = () => {
          if (citySettings.length >= 3) return message.warning('Each city can have a maximum of 3 pinned hotels.');
          setEditing(null); form.resetFields(); form.setFieldsValue({ rank: citySettings.length + 1 }); setModalOpen(true);
        };
        const openEdit = record => { setEditing(record); form.setFieldsValue({ hotelId:record.hotelId, rank:record.rank, period:[dayjs(record.start,format), dayjs(record.end,format)] }); setModalOpen(true); };
        const handleSave = async () => {
          try {
            const values = await form.validateFields();
            const duplicate = citySettings.some(row => row.hotelId === values.hotelId && row.id !== editing?.id);
            if (duplicate) return form.setFields([{name:'hotelId', errors:['This hotel is already pinned for this destination.']}]);
            const record = { id: editing?.id || Date.now(), destination:selectedCity, hotelId:values.hotelId, rank:values.rank, start:values.period[0].format(format), end:values.period[1].format(format) };
            let updated = editing ? settings.map(item => item.id === editing.id ? record : item) : [...settings, record];
            const affected = updated.filter(item => item.destination === selectedCity).sort((a,b) => a.rank-b.rank);
            updated = updated.map(item => { const index = affected.findIndex(a => a.id === item.id); return index > -1 ? {...item, rank:index+1} : item; });
            setSettings(updated); setModalOpen(false); message.success('Pinned hotel settings saved.');
          } catch (_) {}
        };
        const remove = id => { setSettings(old => old.filter(row => row.id !== id).map(row => row.destination === selectedCity ? row : row)); message.success('Pinned hotel removed.'); };
        const columns = [
          { title:'Priority', dataIndex:'rank', width:105, render: rank => <b>#{rank}</b> },
          { title:'Hotel', dataIndex:'hotelId', render: id => <HotelLabel hotel={hotels.find(h => h.id === id)} /> },
          { title:'Schedule', width:310, render: (_, record) => <><div>{record.start} <span className="muted">to</span> {record.end}</div><div className="hint">Expired entries automatically return to default search ordering.</div></> },
          { title:'Status', width:130, render: (_, record) => statusTag(dateStatus(record)) },
          { title:'Action', width:150, render: (_, record) => <Space size="small"><Button type="link" onClick={() => openEdit(record)}>Edit</Button><Popconfirm title="Remove this pinned hotel?" okText="Remove" onConfirm={() => remove(record.id)}><Button type="link" danger>Remove</Button></Popconfirm></Space> }
        ];
        return <ConfigProvider theme={{ token:{ colorPrimary:'#1890ff', borderRadius:2, fontFamily:'Arial, Helvetica, sans-serif' } }}>
          <div className="brand"><span className="brand-mark">≡</span><span>CURATORS</span><span style={{letterSpacing:'1px', fontWeight:400}}>of TRAVEL</span></div>
          <div className="shell">
            <aside className="sidebar">
              <div className="side-link">Dashboard</div><div className="side-link">Client</div><div className="side-link">Membership List</div>
              <div className="side-link">Non-GDS Orders <span style={{marginLeft:'auto'}}>⌄</span></div><div className="side-link">Orders <span style={{marginLeft:'auto'}}>⌄</span></div>
              <div className="side-link">Cruise <span style={{marginLeft:'auto'}}>⌄</span></div><div className="side-link">Management <span style={{marginLeft:'auto'}}>⌃</span></div>
              <div className="side-link section">Public settings <span style={{marginLeft:'auto'}}>⌃</span></div>
              <div className="side-link indent">Announcement</div><div className="side-link indent">Homepage</div><div className="side-link indent">Event page</div>
              <div className="side-link indent selected">Search</div><div className="side-link indent">Collection</div><div className="side-link indent">News</div><div className="side-link indent">VAT Rate</div>
            </aside>
            <main className="main">
              <div className="page-heading"><div><h1>Search</h1><p className="subcopy">Configure featured hotels at the top of destination search results.</p></div><Button>en ⌄</Button></div>
              <Card className="context-card" bodyStyle={{padding:'22px 24px'}}>
                <Row align="middle" gutter={[20,16]}><Col><b>Destination</b></Col><Col flex="330px"><Select value={selectedCity} onChange={setSelectedCity} showSearch optionFilterProp="label" style={{width:'100%'}} options={destinations} /></Col><Col flex="auto"><span className="muted">Select a destination to manage up to three featured hotels.</span></Col></Row>
              </Card>
              <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14}}><div><b style={{fontSize:17}}>Featured hotels for {cityName}</b><div className="hint">Active schedules pin hotels to positions 1–3. Other results follow automatic sorting.</div></div><Button type="primary" onClick={openAdd} disabled={citySettings.length >= 3}>+ Add featured hotel</Button></div>
              <div className="table-card"><Table columns={columns} dataSource={citySettings} rowKey="id" pagination={false} locale={{emptyText:'No featured hotels scheduled for this destination.'}} /></div>
              <div className="footer-note">Prototype uses mock Destination and Hotel Management data. Only Publish hotels are available in the picker.</div>
            </main>
          </div>
          <Modal title={editing ? 'Edit featured hotel' : 'Add featured hotel'} open={isModalOpen} onCancel={() => setModalOpen(false)} onOk={handleSave} okText="Save settings" destroyOnHidden>
            <Form form={form} layout="vertical" requiredMark="optional">
              <Form.Item label="Destination"><Select value={selectedCity} disabled options={destinations} /></Form.Item>
              <Form.Item name="hotelId" label="Published hotel" rules={[{required:true, message:'Please select a published hotel.'}]}><Select showSearch placeholder="Search by hotel, destination or property code" filterOption={(input, option) => option.searchText.includes(input.toLowerCase())} options={availableHotels.map(h => ({value:h.id, label:<HotelLabel hotel={h}/>, searchText:`${h.name} ${h.destinationLabel} ${h.code}`.toLowerCase()}))} /></Form.Item>
              <Form.Item name="rank" label="Priority" rules={[{required:true}]}><Select options={[1,2,3].map(n => ({value:n, label:`Position ${n}`}))} /></Form.Item>
              <Form.Item name="period" label="Pin schedule" rules={[{required:true, message:'Please choose a start and end time.'},{validator:(_, value) => !value || value[1].isAfter(value[0]) ? Promise.resolve() : Promise.reject(new Error('End time must be later than start time.'))}]}><RangePicker showTime format={format} style={{width:'100%'}} /></Form.Item>
            </Form>
          </Modal>
        </ConfigProvider>;
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
