<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search · 搜尋排序驗證</title>
  <link rel="stylesheet" href="https://unpkg.com/antd@5/dist/reset.css" />
  <style>
    :root { --navy:#031b2d; --blue:#1684f5; --ink:#102a43; --soft:#f5f7fa; --line:#e7edf3; }
    * { box-sizing:border-box; } body { margin:0; background:var(--soft); color:var(--ink); font-family:Arial,"Microsoft JhengHei",sans-serif; }
    .brand { height:54px; background:var(--navy); color:#fff; display:flex; align-items:center; gap:10px; padding:0 19px; letter-spacing:3px; font-size:13px; font-weight:600; }
    .brand-mark { border:1.5px solid #fff; height:29px; width:29px; border-radius:50%; display:grid; place-items:center; font-size:15px; letter-spacing:0; }
    .shell { min-height:calc(100vh - 54px); display:flex; } .sidebar { width:235px; background:#fff; border-right:1px solid #edf0f2; padding-top:4px; flex:none; }
    .side-link { height:47px; display:flex; align-items:center; padding:0 25px; color:#11243a; font-size:15px; }.side-link.section { color:var(--blue); background:#fafafa; }.side-link.indent { padding-left:50px; }.side-link.selected { background:#e6f7ff; color:var(--blue); border-right:2px solid var(--blue); }
    .main { flex:1; min-width:0; padding:31px 44px 54px; max-width:1640px; }.page-heading { display:flex; justify-content:space-between; gap:24px; align-items:flex-start; margin-bottom:20px; }.page-heading h1 { margin:0; font-size:28px; font-weight:600; }.subcopy { color:#66788a; margin:7px 0 0; line-height:1.5; }
    .card { background:#fff; border-radius:3px; box-shadow:0 1px 4px rgba(0,0,0,.06); }.filters { padding:22px 24px 5px; margin-bottom:18px; }.section-title { font-size:17px; font-weight:600; }.muted { color:#7b8b9c; }.hint { color:#8492a6; font-size:12px; line-height:1.55; }.formula-strip { background:#eef7ff; border:1px solid #cce9ff; color:#175886; border-radius:4px; padding:11px 14px; font-family:Consolas,"Microsoft JhengHei",monospace; font-size:13px; margin:16px 0; overflow:auto; }
    .rank-cell { width:42px; height:42px; border-radius:50%; background:#edf7ff; color:#1677c8; display:grid; place-items:center; font-weight:700; font-size:16px; }.hotel-name { font-size:16px; font-weight:600; }.hotel-meta { font-size:12px; color:#7c8a9b; margin-top:5px; }.score { color:#0d78c8; font-size:24px; font-weight:700; line-height:1; }.score-label { color:#7c8a9b; font-size:11px; margin-top:5px; }
    .detail-formula { font-family:Consolas,"Microsoft JhengHei",monospace; white-space:normal; overflow-wrap:anywhere; background:#f7fafc; border:1px solid #edf1f5; padding:12px; border-radius:3px; font-size:13px; line-height:1.7; }.metric-name { font-weight:600; }.contribution { color:#1677c8; font-weight:600; }.state-panel { padding:20px 24px; margin-bottom:18px; border-left:4px solid #52c41a; }.state-panel.draft { border-left-color:#faad14; }.settings-card { padding:26px 28px; max-width:900px; }.setting-title { font-size:16px; font-weight:600; margin:5px 0; }.published-formula { background:#f7fafc; border:1px solid #e5ebf0; padding:13px; border-radius:3px; font-family:Consolas,"Microsoft JhengHei",monospace; font-size:13px; line-height:1.65; }
    .detail-wrap { padding:8px 4px 4px; }.formula-box { background:linear-gradient(105deg,#edf8ff,#f8fbff); border:1px solid #cce9ff; border-radius:6px; padding:16px 18px; color:#184a70; }.formula-label { font-size:12px; color:#5d7c94; margin-bottom:8px; }.formula-line { font-family:Consolas,"Microsoft JhengHei",monospace; font-size:14px; line-height:1.85; overflow-wrap:anywhere; }.formula-result { font-size:18px; color:#0875c1; font-weight:700; margin-top:4px; }.metric-grid { display:grid; grid-template-columns:repeat(5,minmax(125px,1fr)); gap:10px; margin-top:14px; }.metric-card { border:1px solid #e6edf3; border-radius:5px; background:#fff; padding:12px; min-width:0; }.metric-card .code { color:#4d657a; font-size:12px; font-weight:700; }.metric-card .raw { color:#152f48; font-size:20px; font-weight:700; margin:6px 0 3px; }.metric-card .calc { color:#1684c9; font-size:12px; }.availability-card { background:#f8fbfd; }.pin-header { display:flex; align-items:end; justify-content:space-between; gap:18px; margin-bottom:14px; }.ant-tabs .ant-tabs-nav { margin-bottom:18px; }.footer-note { color:#7e8a9a; font-size:12px; margin-top:16px; } @media(max-width:1100px){.metric-grid{grid-template-columns:repeat(3,minmax(125px,1fr))}} @media(max-width:650px){.metric-grid{grid-template-columns:repeat(2,minmax(120px,1fr))}} @media(max-width:900px){.sidebar{width:190px}.main{padding:22px 18px}.side-link{padding-left:18px}.side-link.indent{padding-left:35px}.page-heading{display:block}.page-heading > div:last-child{margin-top:14px}}
  </style>
</head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/dayjs@1/dayjs.min.js"></script>
<script src="https://unpkg.com/antd@5/dist/antd.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {Alert, Button, Card, Col, ConfigProvider, DatePicker, Divider, Form, InputNumber, Modal, Popconfirm, Radio, Row, Select, Space, Table, Tabs, Tag, message} = antd;
const {RangePicker} = DatePicker;
const destinations=[{value:'tokyo',label:'Tokyo, Japan'},{value:'new-york',label:'New York, USA'},{value:'copenhagen',label:'Copenhagen, Denmark'},{value:'miami',label:'Miami, USA'}];
const hotels=[
 {id:'tok-001',name:'Aman Tokyo',code:'TYOAMN01',city:'tokyo',area:'Otemachi',rating:4.9,orders:38,favorites:142,views:3290,newBoost:0,feedback:4.6,availability:1.18},
 {id:'tok-002',name:'The Peninsula Tokyo',code:'TYOPNH02',city:'tokyo',area:'Marunouchi',rating:4.8,orders:29,favorites:176,views:4180,newBoost:0,feedback:5.2,availability:1.12},
 {id:'tok-003',name:'HOSHINOYA Tokyo',code:'TYOHOS03',city:'tokyo',area:'Otemachi',rating:4.7,orders:23,favorites:210,views:5660,newBoost:3,feedback:4.9,availability:1.06},
 {id:'tok-004',name:'Tokyo Bay Edition',code:'TYOEDT04',city:'tokyo',area:'Toranomon',rating:4.6,orders:18,favorites:122,views:3890,newBoost:6,feedback:4.2,availability:1.00},
 {id:'ny-001',name:'1 Hotel Brooklyn Bridge',code:'BINYCHBB',city:'new-york',area:'Brooklyn',rating:4.7,orders:35,favorites:198,views:4710,newBoost:0,feedback:4.7,availability:1.14},
 {id:'ny-002',name:'The Whitby Hotel',code:'NYWHIT02',city:'new-york',area:'Midtown',rating:4.8,orders:31,favorites:167,views:4030,newBoost:2,feedback:5.1,availability:1.08},
 {id:'cop-001',name:'Hotel d’Angleterre',code:'CPHPHS01',city:'copenhagen',area:'Kongens Nytorv',rating:4.8,orders:26,favorites:113,views:2780,newBoost:0,feedback:5.4,availability:1.16},
 {id:'mia-001',name:'1 Hotel South Beach',code:'BIMIA805',city:'miami',area:'South Beach',rating:4.7,orders:33,favorites:155,views:3620,newBoost:0,feedback:4.8,availability:1.10}
];
const initial={orders:1,favorites:.10,views:.01,newBoost:1,feedback:1};
const nf=n=>Number(n).toLocaleString('zh-TW',{maximumFractionDigits:2});
function ScoreDetail({record, coefficients}){
 const m=record.metrics, c=record.contributions;
 const cards=[['O30','有效訂單',m.orders,coefficients.orders,c.orders],['W30','收藏數量',m.favorites,coefficients.favorites,c.favorites],['V30','頁面瀏覽',m.views,coefficients.views,c.views],['NewBoost','新酒店加權',m.newBoost,coefficients.newBoost,c.newBoost],['FeedbackBoost','客評加權',m.feedback,coefficients.feedback,c.feedback]];
 return <div className="detail-wrap"><div className="formula-box"><div className="formula-label">此酒店的完整計分公式</div><div className="formula-line">Score = {nf(m.availability)} × ({nf(m.orders)} × {nf(coefficients.orders)} + {nf(m.favorites)} × {nf(coefficients.favorites)} + {nf(m.views)} × {nf(coefficients.views)} + {nf(m.newBoost)} × {nf(coefficients.newBoost)} + {nf(m.feedback)} × {nf(coefficients.feedback)})</div><div className="formula-line">　　　= {nf(m.availability)} × {nf(record.base)}</div><div className="formula-result">　　　= {nf(record.score)}</div></div><div className="metric-grid"><div className="metric-card availability-card"><div className="code">Availability</div><div className="raw">{nf(m.availability)}</div><div className="calc">房況加權 · 最終相乘</div></div>{cards.map(x=><div className="metric-card" key={x[0]}><div className="code">{x[0]} · {x[1]}</div><div className="raw">{nf(x[2])}</div><div className="calc">{nf(x[2])} × {nf(x[3])} ＝ <b>{nf(x[4])}</b></div></div>)}</div></div>
}
function PinnedHotels(){
 const [pinCity,setPinCity]=React.useState('tokyo'); const [items,setItems]=React.useState([{id:1,city:'tokyo',hotelId:'tok-001',rank:1,start:'2026-11-01 00:00',end:'2026-12-15 23:59'},{id:2,city:'tokyo',hotelId:'tok-002',rank:2,start:'2026-12-01 00:00',end:'2026-12-31 23:59'},{id:3,city:'tokyo',hotelId:'tok-003',rank:3,start:'2026-09-01 00:00',end:'2026-10-01 23:59'},{id:4,city:'new-york',hotelId:'ny-001',rank:1,start:'2026-11-01 00:00',end:'2026-12-31 23:59'}]); const [open,setOpen]=React.useState(false); const [editing,setEditing]=React.useState(null); const [form]=Form.useForm();
 const rows=items.filter(x=>x.city===pinCity).sort((a,b)=>a.rank-b.rank); const cityHotels=hotels.filter(h=>h.city===pinCity);
 const showAdd=()=>{setEditing(null);form.resetFields();form.setFieldsValue({rank:rows.length+1,period:[dayjs(),dayjs().add(30,'day')]});setOpen(true)}; const showEdit=r=>{setEditing(r);form.setFieldsValue({hotelId:r.hotelId,rank:r.rank,period:[dayjs(r.start,'YYYY-MM-DD HH:mm'),dayjs(r.end,'YYYY-MM-DD HH:mm')]});setOpen(true)};
 const save=async()=>{try{const v=await form.validateFields();if(items.some(x=>x.city===pinCity&&x.hotelId===v.hotelId&&x.id!==editing?.id)){form.setFields([{name:'hotelId',errors:['此酒店已被釘選。']}]);return}const next={id:editing?.id||Date.now(),city:pinCity,hotelId:v.hotelId,rank:v.rank,start:v.period[0].format('YYYY-MM-DD HH:mm'),end:v.period[1].format('YYYY-MM-DD HH:mm')};let all=editing?items.map(x=>x.id===editing.id?next:x):[...items,next];const group=all.filter(x=>x.city===pinCity).sort((a,b)=>a.rank-b.rank);all=all.map(x=>{const idx=group.findIndex(g=>g.id===x.id);return idx>-1?{...x,rank:idx+1}:x});setItems(all);setOpen(false);message.success('釘選酒店設定已儲存。')}catch(e){}};
 const cols=[{title:'優先順序',dataIndex:'rank',width:120,render:n=><b>#{n}</b>},{title:'酒店',dataIndex:'hotelId',render:id=>{const h=hotels.find(x=>x.id===id);return <div><div className="hotel-name">{h.name}</div><div className="hotel-meta">{h.area} · {h.code}</div></div>}},{title:'釘選期間',width:320,render:(_,r)=><div><div>{r.start} <span className="muted">至</span> {r.end}</div><div className="hint">到期後將自動回到一般搜尋排序。</div></div>},{title:'狀態',width:110,render:(_,r)=>{const now=dayjs();return now.isAfter(dayjs(r.end,'YYYY-MM-DD HH:mm'))?<Tag>已到期</Tag>:now.isBefore(dayjs(r.start,'YYYY-MM-DD HH:mm'))?<Tag color="blue">排程中</Tag>:<Tag color="green">啟用中</Tag>}},{title:'操作',width:155,render:(_,r)=><Space size="small"><Button type="link" onClick={()=>showEdit(r)}>編輯</Button><Popconfirm title="確定移除此釘選酒店？" okText="移除" cancelText="取消" onConfirm={()=>{setItems(x=>x.filter(i=>i.id!==r.id));message.success('已移除釘選酒店。')}}><Button type="link" danger>移除</Button></Popconfirm></Space>}];
 return <><Card className="card filters"><Row align="middle" gutter={[20,16]}><Col><b>目的地</b></Col><Col flex="330px"><Select value={pinCity} onChange={setPinCity} options={destinations} style={{width:'100%'}}/></Col><Col flex="auto"><span className="muted">每個目的地最多可釘選 3 間酒店，啟用期間會固定顯示於前 3 名。</span></Col></Row></Card><div className="pin-header"><div><div className="section-title">{destinations.find(d=>d.value===pinCity).label} 的釘選酒店</div><div className="hint">未被釘選的酒店會依 Tab 2 的自動排序公式顯示。</div></div><Button type="primary" onClick={showAdd} disabled={rows.length>=3}>+ 新增釘選酒店</Button></div><Card className="card" bodyStyle={{padding:0}}><Table columns={cols} dataSource={rows} rowKey="id" pagination={false} locale={{emptyText:'此目的地尚未設定釘選酒店。'}}/></Card><div className="footer-note">此 Tab 保留原始的釘選酒店管理功能。</div><Modal title={editing?'編輯釘選酒店':'新增釘選酒店'} open={open} onCancel={()=>setOpen(false)} onOk={save} okText="儲存設定" cancelText="取消" destroyOnHidden><Form form={form} layout="vertical"><Form.Item label="目的地"><Select value={pinCity} disabled options={destinations}/></Form.Item><Form.Item name="hotelId" label="酒店" rules={[{required:true,message:'請選擇酒店。'}]}><Select options={cityHotels.map(h=>({value:h.id,label:`${h.name} · ${h.code}`}))}/></Form.Item><Form.Item name="rank" label="優先順序" rules={[{required:true}]}><Select options={[1,2,3].map(n=>({value:n,label:`第 ${n} 名`}))}/></Form.Item><Form.Item name="period" label="釘選期間" rules={[{required:true,message:'請選擇起訖時間。'}]}><RangePicker showTime format="YYYY-MM-DD HH:mm" style={{width:'100%'}}/></Form.Item></Form></Modal></>;
}
function App(){
 const [tab,setTab]=React.useState('pinned'); const [city,setCity]=React.useState('tokyo'); const [dateMode,setDateMode]=React.useState('withDate'); const [dates,setDates]=React.useState([dayjs().add(14,'day'),dayjs().add(16,'day')]); const [guests,setGuests]=React.useState(2); const [draft,setDraft]=React.useState(initial); const [savedDraft,setSavedDraft]=React.useState(initial); const [published,setPublished]=React.useState(initial); const [form]=Form.useForm();
 const isDirty=Object.keys(draft).some(k=>draft[k]!==savedDraft[k]);
 const results=React.useMemo(()=>hotels.filter(h=>h.city===city).map(h=>{const availability=Math.max(.7,h.availability-(guests>2?.06:0)+(dateMode==='withoutDate'?.04:0));const views=Math.round(h.views*(dateMode==='withDate'?1:0.78));const metrics={...h,availability,views};const contributions={orders:h.orders*draft.orders,favorites:h.favorites*draft.favorites,views:views*draft.views,newBoost:h.newBoost*draft.newBoost,feedback:h.feedback*draft.feedback};const base=contributions.orders+contributions.favorites+contributions.views+contributions.newBoost+contributions.feedback;return {...h,metrics,contributions,base,score:base*availability};}).sort((a,b)=>b.score-a.score).map((r,i)=>({...r,rank:i+1})),[city,dateMode,guests,draft]);
 const saveDraft=()=>{setSavedDraft({...draft});message.success('草稿已儲存，模擬結果已使用此設定。');}; const publish=()=>{setPublished({...draft});setSavedDraft({...draft});message.success('公式已確認發布至前台。');};
 const columns=[{title:'排名',dataIndex:'rank',width:86,render:n=><div className="rank-cell">{n}</div>},{title:'酒店',dataIndex:'name',render:(n,r)=><div><div className="hotel-name">{n}</div><div className="hotel-meta">{r.area} · {r.code} · <span style={{color:'#e89a28'}}>★ {r.rating}</span></div></div>},{title:'最終 Score',dataIndex:'score',width:130,align:'right',render:v=><div><div className="score">{nf(v)}</div><div className="score-label">依 Score 由高至低</div></div>},{title:'排序組成',width:260,render:(_,r)=><div className="hint">Availability {nf(r.metrics.availability)} × 基礎分 {nf(r.base)}<br/>O30 {nf(r.metrics.orders)} · W30 {nf(r.metrics.favorites)} · V30 {nf(r.metrics.views)}<br/><span style={{color:'#1684c9'}}>點左側箭頭展開計分明細</span></div>}];
 const preview=<><Card className="card filters"><Form layout="vertical"><Row gutter={[16,0]} align="bottom"><Col xs={24} md={7}><Form.Item label="目的地"><Select value={city} onChange={setCity} options={destinations}/></Form.Item></Col><Col xs={24} md={8}><Form.Item label="入住日期"><Radio.Group value={dateMode} onChange={e=>setDateMode(e.target.value)} style={{marginBottom:8}}><Radio value="withDate">帶入住日期</Radio><Radio value="withoutDate">未帶日期</Radio></Radio.Group><RangePicker disabled={dateMode==='withoutDate'} value={dates} onChange={v=>setDates(v)} style={{width:'100%'}}/></Form.Item></Col><Col xs={24} md={4}><Form.Item label="旅客人數"><InputNumber min={1} max={8} value={guests} onChange={setGuests} style={{width:'100%'}} addonAfter="人"/></Form.Item></Col><Col xs={24} md={5}><Button type="primary" block onClick={()=>message.success('已依目前條件重新計算排序')}>搜尋並重新計算</Button></Col></Row></Form></Card><Alert type={isDirty?'warning':'info'} showIcon message={isDirty?'目前模擬使用尚未儲存的公式調整':'目前模擬使用草稿版本公式'} description={isDirty?'請儲存草稿或確認發布；前台正式環境仍使用已發布版本。':'可在「排序公式設定」調整係數，結果會立即重新排序。'} style={{marginBottom:18}}/><div className="formula-strip">Score = Availability × ({nf(draft.orders)} × O30 + {nf(draft.favorites)} × W30 + {nf(draft.views)} × V30 + {nf(draft.newBoost)} × NewBoost + {nf(draft.feedback)} × FeedbackBoost)</div><div style={{display:'flex',justifyContent:'space-between',alignItems:'end',marginBottom:13}}><div><div className="section-title">前台搜尋結果模擬</div><div className="hint">{destinations.find(d=>d.value===city).label} · {dateMode==='withDate'?`${dates?.[0]?.format('YYYY/MM/DD')} – ${dates?.[1]?.format('YYYY/MM/DD')}`:'尚未指定入住日期'} · {guests} 位旅客</div></div><Tag color="blue">{results.length} 間酒店</Tag></div><Card className="card" bodyStyle={{padding:0}}><Table columns={columns} dataSource={results} rowKey="id" pagination={false} expandable={{expandedRowRender:r=><ScoreDetail record={r} coefficients={draft}/>,expandRowByClick:false,columnWidth:48}}/></Card><div className="footer-note">所有數據皆為原型模擬資料；點選每列最左側箭頭，即可展開完整公式與各項分數貢獻。</div></>;
 const settings=<><Card className="card state-panel"><Row gutter={[20,10]} align="middle"><Col flex="auto"><b>已發布至前台的公式</b><div className="hint">目前前台正式排序使用的版本</div></Col><Col><Tag color="green">已發布</Tag></Col></Row><div className="published-formula">Score = Availability × ({nf(published.orders)} × O30 + {nf(published.favorites)} × W30 + {nf(published.views)} × V30 + {nf(published.newBoost)} × NewBoost + {nf(published.feedback)} × FeedbackBoost)</div></Card><Card className="card settings-card"><div className="setting-title">草稿公式設定</div><p className="muted" style={{marginTop:5}}>調整係數後，「前台搜尋模擬」會立即使用目前設定預覽；確認發布前不會影響真正前台。</p><Divider/><Form form={form} layout="vertical"><Row gutter={18}><Col xs={24} sm={12}><Form.Item label="O30：有效訂單係數" extra="近 30 天有效訂單數"><InputNumber min={0} step={.1} value={draft.orders} onChange={v=>setDraft(x=>({...x,orders:v??0}))} style={{width:'100%'}}/></Form.Item></Col><Col xs={24} sm={12}><Form.Item label="W30：收藏數量係數" extra="預設為 0.10"><InputNumber min={0} step={.01} value={draft.favorites} onChange={v=>setDraft(x=>({...x,favorites:v??0}))} style={{width:'100%'}}/></Form.Item></Col><Col xs={24} sm={12}><Form.Item label="V30：頁面瀏覽係數" extra="預設為 0.01；會依是否帶入住日期顯示對應數值"><InputNumber min={0} step={.001} value={draft.views} onChange={v=>setDraft(x=>({...x,views:v??0}))} style={{width:'100%'}}/></Form.Item></Col><Col xs={24} sm={12}><Form.Item label="NewBoost：新酒店加權係數"><InputNumber min={0} step={.1} value={draft.newBoost} onChange={v=>setDraft(x=>({...x,newBoost:v??0}))} style={{width:'100%'}}/></Form.Item></Col><Col xs={24} sm={12}><Form.Item label="FeedbackBoost：SurveyCake 評分係數"><InputNumber min={0} step={.1} value={draft.feedback} onChange={v=>setDraft(x=>({...x,feedback:v??0}))} style={{width:'100%'}}/></Form.Item></Col><Col xs={24} sm={12}><Form.Item label="Availability：房況加權"><InputNumber value={1} disabled style={{width:'100%'}}/><div className="hint">由每間酒店的可售房況資料自動帶入，不設固定全域係數。</div></Form.Item></Col></Row><Divider/><Space wrap><Button onClick={()=>setDraft(initial)}>還原預設值</Button><Button onClick={saveDraft} disabled={!isDirty}>儲存草稿</Button><Button type="primary" onClick={publish}>確認發布至前台</Button></Space>{isDirty&&<div className="hint" style={{marginTop:12,color:'#d48806'}}>尚有未儲存的調整；目前僅反映於模擬頁。</div>}</Form></Card></>;
